name: Deploy LOOP web UI

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          HUB_API_URL: ${{ vars.HUB_API_URL }}
        run: |
          mkdir -p _site/static
          cp static/index.html _site/index.html
          cp -R static/. _site/static/
          if [ -n "$HUB_API_URL" ]; then
            printf 'window.HUB_API_BASE = %s;\n' "$(jq -Rn --arg v "$HUB_API_URL" '$v')" > _site/static/config.js
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
